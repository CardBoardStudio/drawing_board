name: Rust and container
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Rust checks and Wasm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .tools
          key: wasm-bindgen-cli-${{ runner.os }}-${{ runner.arch }}-0.2.114
      - run: node scripts/test-galactic-reach.cjs
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: ./scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: drawing-board-web
          path: dist/
          retention-days: 7
  container:
    name: Preview container smoke
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: drawing-board:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run preview-mode container
        run: |
          docker run --detach --name drawing-board-smoke \
            --publish 127.0.0.1:3100:3000 \
            --env RENDER=true --env IS_PULL_REQUEST=true \
            --env RENDER_EXTERNAL_URL=https://preview.example \
            --env PREVIEW_AUTH=1 \
            --env PREVIEW_ACCESS_CODE=ci-only-access-code-not-a-secret \
            drawing-board:test
      - name: Play a two-player match through HTTP
        env:
          SMOKE_PREVIEW_CODE: ci-only-access-code-not-a-secret
        run: python3 scripts/smoke.py
      - name: Container diagnostics
        if: failure()
        run: docker logs drawing-board-smoke
      - name: Stop smoke container
        if: always()
        run: docker rm --force drawing-board-smoke || true
