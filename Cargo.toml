[workspace]
members = ["crates/game-core", "crates/game", "crates/server", "crates/web"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
game = { path = "crates/game" }
game-core = { path = "crates/game-core" }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
