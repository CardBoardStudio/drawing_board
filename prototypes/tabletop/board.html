<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Public board · Galactic Reach</title><link rel="stylesheet" href="board.css"><script defer src="board.js"></script></head>
<body><main class="tabletop">
<header><div><p class="eyebrow">GALACTIC REACH · PUBLIC BOARD</p><h1 id="title">Opening table…</h1></div><nav><button id="wake" type="button">Keep screen awake</button><a id="rules" href="/galactic-reach/rulebook.html#public-board" target="_blank" rel="noopener">Rules</a></nav></header>
<p id="status" role="status" aria-live="polite">Connecting…</p>
<section class="players" id="players" aria-label="Factions"></section>
<div class="board-layout"><section class="map-panel" aria-label="Public galaxy"><svg id="map" viewBox="-320 -280 640 560" role="group" aria-label="Galaxy sectors"></svg></section>
<aside><h2 id="sector-title">Inspect the galaxy</h2><p id="sector">Tap a sector for its public details. Make your choices on your phone.</p><p id="battle"></p><button id="cards-open" type="button">Face-up cards</button><p class="privacy">Each player’s phone holds their hand. This board takes no player seat.</p></aside></div>
<dialog id="cards"><div class="dialog-heading"><h2>Public cards</h2><button id="cards-close" type="button" aria-label="Close public cards">Close</button></div><div id="cards-content"></div></dialog>
</main></body></html>
